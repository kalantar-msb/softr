name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-algorithm:
    name: Validate Go Algorithm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: gofmt check
        working-directory: algorithms
        run: |
          gofmt_out=$(gofmt -l .)
          if [ -n "$gofmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$gofmt_out"
            exit 1
          fi
          echo "gofmt OK"

      - name: go vet (syntax check)
        working-directory: algorithms
        run: |
          # Parse-check each file individually (no module needed for syntax)
          for f in *.go; do
            gofmt -e "$f" > /dev/null && echo "syntax OK: $f"
          done

      - name: Run algorithm unit tests
        working-directory: algorithms
        run: go run ceiling_test.go
