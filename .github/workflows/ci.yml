name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: true

      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32  # v5.0.2
        with:
          go-version: "1.22"

      - name: Tidy
        run: |
          go mod tidy
          git diff --exit-code go.sum || (echo "go.sum is out of date; run 'go mod tidy'" && exit 1)

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt check
        run: |
          out=$(gofmt -l ./algorithms/)
          if [ -n "$out" ]; then
            echo "Files not gofmt'd:" && echo "$out" && exit 1
          fi
